# PC-Free - macOS Virtual Machine Configuration
services:
  macos:
    image: dockurr/macos
    container_name: pc-free-macos
    environment:
      VERSION: "catalina" # High performance lightweight macOS release for web streaming
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "64G"
    cap_add:
      - NET_ADMIN
    ports:
      - "8009:8006" # Web interface (noVNC / HTTP)
      - "5900:5900" # VNC interface
    volumes:
      - macos-data:/storage
    devices:
      - "/dev/kvm:/dev/kvm"
    stop_grace_period: 2m
    restart: always

volumes:
  macos-data:
