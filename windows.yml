# PC-Free - Windows Virtual Machine Configuration
services:
  windows:
    image: dockurr/windows
    container_name: pc-free-windows
    environment:
      VERSION: "10"
      USERNAME: ${WINDOWS_USERNAME:-pcuser}
      PASSWORD: ${WINDOWS_PASSWORD:-pcpassword123}
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "64G"
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006" # Web interface (noVNC / HTTP)
      - "3389:3389/tcp" # RDP
      - "3389:3389/udp"
    volumes:
      - /tmp/docker-data:/mnt/disco1
      - windows-data:/storage
    devices:
      - "/dev/kvm:/dev/kvm"
      - "/dev/net/tun:/dev/net/tun"
    stop_grace_period: 2m
    restart: always

volumes:
  windows-data:
